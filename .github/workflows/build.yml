name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "altstore-source.json"
      - "README.md"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Derive version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      # VLCKit ships as one universal XCFramework of roughly a gigabyte.
      # Without this cache every run re-downloads it.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: |
          sed -i '' "s|MARKETING_VERSION: \"1.0.0\"|MARKETING_VERSION: \"${{ steps.version.outputs.version }}\"|" project.yml
          sed -i '' "s|CURRENT_PROJECT_VERSION: \"1\"|CURRENT_PROJECT_VERSION: \"$GITHUB_RUN_NUMBER\"|" project.yml
          mkdir -p Generated
          xcodegen generate

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project EasynewsPlayer.xcodeproj \
            -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee /tmp/resolve.log || {
              tail -30 /tmp/resolve.log | while IFS= read -r l; do
                printf '::error::RESOLVE %s\n' "${l:0:300}"
              done
              exit 1
            }
          echo "Resolved packages:"
          ls -la .spm-cache 2>/dev/null || true

      # ------------------------------------------------------------ iOS
      - name: Build iOS (unsigned)
        run: |
          set -o pipefail
          (
              xcodebuild build \
                -project EasynewsPlayer.xcodeproj \
                -scheme EasynewsPlayer-iOS \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -derivedDataPath build-ios \
                -clonedSourcePackagesDirPath .spm-cache \
                CODE_SIGN_IDENTITY="" \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGNING_ALLOWED=NO

          ) 2>&1 | tee /tmp/ios.log || {
            grep -E 'error:' /tmp/ios.log | sort -u | head -12 | while IFS= read -r l; do
              printf '::error::IOS %s\n' "${l:0:350}"
            done
            printf '::error::IOS ---- last 20 lines ----\n'
            tail -20 /tmp/ios.log | while IFS= read -r l; do
              printf '::error::IOS %s\n' "${l:0:250}"
            done
            exit 1
          }

      - name: Package IPA
        run: |
          APP="build-ios/Build/Products/Release-iphoneos/EasynewsPlayer.app"
          test -d "$APP" || { echo "::error::App bundle not found at $APP"; exit 1; }

          # xcodebuild will not ad-hoc sign against the iOS SDK, so do it here.
          # codesign has no such restriction and adds the LC_CODE_SIGNATURE
          # slot that AltStore/Sideloadly later overwrite with a real identity.
          # Nested code must be signed before the bundle that contains it.
          codesign --force --sign - --timestamp=none \
            "$APP/Frameworks/VLCKit.framework/VLCKit" || {
              echo "::error::Failed to ad-hoc sign VLCKit"; exit 1; }
          codesign --force --sign - --timestamp=none \
            "$APP/Frameworks/VLCKit.framework" || {
              echo "::error::Failed to ad-hoc sign VLCKit.framework"; exit 1; }
          codesign --force --sign - --timestamp=none "$APP" || {
              echo "::error::Failed to ad-hoc sign the app bundle"; exit 1; }

          codesign -dv "$APP" 2>&1 | head -5 || true

          python3 Scripts/check_signature.py "$APP"

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "EasynewsPlayer.ipa" Payload
          rm -rf Payload
          ls -lh EasynewsPlayer.ipa

      # ---------------------------------------------------------- macOS
      - name: Build macOS (ad-hoc signed)
        run: |
          set -o pipefail
          (
              xcodebuild build \
                -project EasynewsPlayer.xcodeproj \
                -scheme EasynewsPlayer-macOS \
                -configuration Release \
                -destination 'generic/platform=macOS' \
                -derivedDataPath build-mac \
                -clonedSourcePackagesDirPath .spm-cache \
                CODE_SIGN_IDENTITY="-" \
                CODE_SIGN_STYLE=Manual

          ) 2>&1 | tee /tmp/mac.log || {
            grep -E 'error:' /tmp/mac.log | sort -u | head -12 | while IFS= read -r l; do
              printf '::error::MAC %s\n' "${l:0:350}"
            done
            printf '::error::MAC ---- last 20 lines ----\n'
            tail -20 /tmp/mac.log | while IFS= read -r l; do
              printf '::error::MAC %s\n' "${l:0:250}"
            done
            exit 1
          }

      - name: Zip macOS app
        run: |
          APP="build-mac/Build/Products/Release/EasynewsPlayer.app"
          test -d "$APP" || { echo "::error::App bundle not found at $APP"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$APP" "EasynewsPlayer-macOS.zip"
          ls -lh EasynewsPlayer-macOS.zip

      # ---------------------------------------------------- Ad Hoc / OTA
      # Everything below is skipped until the signing secrets exist, so the
      # unsigned AltStore path keeps working in the meantime.
      - name: Check for signing secrets
        id: signing
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present - will build a signed Ad Hoc IPA."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets - skipping Ad Hoc build."
          fi

      - name: Import certificate and profile
        if: steps.signing.outputs.available == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI password prompt that never appears.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/pp.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/pp.mobileprovision" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$RUNNER_TEMP/pp.mobileprovision" | plutil -extract Name raw -)
          cp "$RUNNER_TEMP/pp.mobileprovision" "$PROFILES/$UUID.mobileprovision"

          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Imported profile: $NAME ($UUID)"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build signed Ad Hoc IPA
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project EasynewsPlayer.xcodeproj \
            -scheme EasynewsPlayer-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EasynewsPlayer.xcarchive" \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" 2>&1 | tee /tmp/archive.log || {
              grep -E 'error:' /tmp/archive.log | sort -u | head -12 | while IFS= read -r l; do
                printf '::error::ARCHIVE %s\n' "${l:0:350}"
              done
              exit 1
            }

          # Xcode 26 renamed the ad-hoc export method to "release-testing" and
          # rejects the old name; older Xcode only knows "ad-hoc". Try both.
          export_with() {
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$1</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict><key>com.vvfl55.easynewsplayer</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/EasynewsPlayer.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$RUNNER_TEMP/export"
          }

          export_with release-testing || export_with ad-hoc

          cp "$RUNNER_TEMP/export/EasynewsPlayer.ipa" EasynewsPlayer-adhoc.ipa
          ls -lh EasynewsPlayer-adhoc.ipa
          echo "--- signature ---"
          unzip -qo EasynewsPlayer-adhoc.ipa -d "$RUNNER_TEMP/verify"
          codesign -dv --verbose=2 "$RUNNER_TEMP/verify/Payload/EasynewsPlayer.app" 2>&1 | head -8

      - name: Publish OTA install page
        if: steps.signing.outputs.available == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PAGES="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          cp EasynewsPlayer-adhoc.ipa "$SITE/EasynewsPlayer.ipa"
          cp icon-57.png icon-512.png "$SITE/"

          # display-image and full-size-image are both mandatory. Omitting
          # either makes iOS abort the install without explaining why.
          cat > "$SITE/manifest.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
            <key>assets</key><array>
              <dict>
                <key>kind</key><string>software-package</string>
                <key>url</key><string>$PAGES/EasynewsPlayer.ipa</string>
              </dict>
              <dict>
                <key>kind</key><string>display-image</string>
                <key>url</key><string>$PAGES/icon-57.png</string>
              </dict>
              <dict>
                <key>kind</key><string>full-size-image</string>
                <key>url</key><string>$PAGES/icon-512.png</string>
              </dict>
            </array>
            <key>metadata</key><dict>
              <key>bundle-identifier</key><string>com.vvfl55.easynewsplayer</string>
              <key>bundle-version</key><string>$VERSION</string>
              <key>kind</key><string>software</string>
              <key>title</key><string>Easynews Player</string>
            </dict>
          </dict></array></dict></plist>
          PLIST

          cat > "$SITE/index.html" <<HTML
          <!DOCTYPE html>
          <html lang="en"><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Easynews Player</title>
          <style>
            :root { color-scheme: dark; }
            body { margin:0; min-height:100vh; display:flex; align-items:center;
                   justify-content:center; background:#0f1620; color:#e8eaed;
                   font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;
                   text-align:center; padding:24px; }
            .card { max-width:340px; }
            img { width:96px; height:96px; border-radius:22px; margin-bottom:20px; }
            h1 { font-size:22px; margin:0 0 4px; }
            .ver { color:#8b949e; font-size:14px; margin-bottom:28px; }
            a.btn { display:block; background:#F09E3A; color:#0f1620; font-weight:600;
                    padding:16px; border-radius:14px; text-decoration:none; }
            .note { color:#8b949e; font-size:13px; margin-top:22px; }
          </style></head><body><div class="card">
            <img src="icon-512.png" alt="">
            <h1>Easynews Player</h1>
            <div class="ver">Version $VERSION</div>
            <a class="btn" href="itms-services://?action=download-manifest&amp;url=$PAGES/manifest.plist">Install</a>
            <p class="note">Open this page in Safari on the iPhone.
            Other browsers cannot start an install.</p>
          </div></body></html>
          HTML

          cd "$SITE"
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish $VERSION"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "Install page: $PAGES"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasynewsPlayer-${{ steps.version.outputs.version }}
          path: |
            EasynewsPlayer.ipa
            EasynewsPlayer-macOS.zip

      # -------------------------------------------------------- Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EasynewsPlayer.ipa
            EasynewsPlayer-macOS.zip
            EasynewsPlayer-adhoc.ipa
          fail_on_unmatched_files: false
          generate_release_notes: true

      # AltStore polls this file, sees the new version, and offers a one-tap
      # update. Point AltStore at:
      #   https://raw.githubusercontent.com/OWNER/REPO/main/altstore-source.json
      - name: Regenerate AltStore source
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SIZE=$(stat -f%z EasynewsPlayer.ipa)
          DATE=$(date -u +%Y-%m-%d)
          DOWNLOAD="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/EasynewsPlayer.ipa"
          ICON="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/icon.png"

          cat > altstore-source.json <<JSON
          {
            "name": "Easynews Player",
            "identifier": "com.vvfl55.easynewsplayer.source",
            "subtitle": "Usenet search with a real codec stack",
            "description": "Personal source for Easynews Player.",
            "iconURL": "$ICON",
            "tintColor": "#F09E3A",
            "website": "https://github.com/$GITHUB_REPOSITORY",
            "apps": [
              {
                "name": "Easynews Player",
                "bundleIdentifier": "com.vvfl55.easynewsplayer",
                "developerName": "$GITHUB_REPOSITORY_OWNER",
                "subtitle": "Search Easynews, play anything",
                "localizedDescription": "Search Easynews and stream results with VLC's decoder. Plays MKV, HEVC, AV1, AC3, E-AC3 and DTS natively, none of which AVPlayer supports. Files stream over HTTPS range requests, so seeking works without downloading first.",
                "iconURL": "$ICON",
                "tintColor": "#F09E3A",
                "category": "entertainment",
                "screenshots": [],
                "versions": [
                  {
                    "version": "$VERSION",
                    "date": "$DATE",
                    "localizedDescription": "See the GitHub release notes for changes.",
                    "downloadURL": "$DOWNLOAD",
                    "size": $SIZE,
                    "minOSVersion": "16.0"
                  }
                ],
                "appPermissions": { "entitlements": [], "privacy": {} }
              }
            ]
          }
          JSON

          cp altstore-source.json /tmp/source.json
          git reset --hard HEAD
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/source.json altstore-source.json
          git add altstore-source.json
          git diff --staged --quiet && echo "No change" && exit 0
          git commit -m "Publish $VERSION to AltStore source [skip ci]"
          # main can move while this job runs; rebase and retry rather than fail the release.
          for attempt in 1 2 3; do
            if git push origin main; then echo "pushed"; break; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin main || exit 1
            sleep 3
          done
